name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: "dev (Launchpad) or prod (Orbit)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      ENVIRONMENT: ${{ inputs.environment }}
      SERVICE: team17-${{ inputs.environment }}
      RUNTIME_SA: ${{ inputs.environment }}-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/team17/cra-service-${{ inputs.environment }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Run migrations
        run: |
          gcloud run jobs deploy "$SERVICE-migrate" \
            --image "$IMAGE" --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --set-secrets "DATABASE_URL=$ENVIRONMENT-database-url:latest,DJANGO_SECRET_KEY=$ENVIRONMENT-django-secret-key:latest" \
            --command python --args="manage.py,migrate,--noinput" \
            --max-retries 0 --task-timeout 300 --quiet
          gcloud run jobs execute "$SERVICE-migrate" --region "$REGION" --wait

      - name: Deploy service
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --set-secrets "DATABASE_URL=$ENVIRONMENT-database-url:latest,DJANGO_SECRET_KEY=$ENVIRONMENT-django-secret-key:latest,API_TOKEN=$ENVIRONMENT-api-token:latest" \
            --set-env-vars "DJANGO_DEBUG=false,ALLOWED_HOSTS=.run.app" \
            --cpu 1 --memory 512Mi \
            --min-instances 0 --max-instances 1 \
            --concurrency 80 --timeout 30 --cpu-throttling \
            --allow-unauthenticated --quiet

      - name: Smoke test /health
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          for attempt in $(seq 1 10); do
            if curl -fsS "$URL/health"; then
              echo
              echo "### $SERVICE is live: $URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "Smoke test failed for $URL"
          exit 1
